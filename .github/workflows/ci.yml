name: CI
on: [push, pull_request]
jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 24, cache: npm }
      - run: npm ci
      - run: node -e "console.log(new Intl.DateTimeFormat('en-CA',{timeZone:'Africa/Casablanca',year:'numeric',month:'2-digit',day:'2-digit',hour:'2-digit',minute:'2-digit',hourCycle:'h23',timeZoneName:'longOffset'}).format(new Date('2026-09-30T23:30:00Z')))"
      - run: npm run lint
      - run: npm run typecheck
      - run: npm test
      - run: npm run build
      # test:e2e is skipped here: it starts its own Next server and drives a real
      # system Chrome via playwright-core (channel: 'chrome'), which isn't present
      # on a plain ubuntu-latest runner without extra browser-install steps. Run it
      # locally before releases instead.
